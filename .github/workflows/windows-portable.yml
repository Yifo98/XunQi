name: Windows source and BAT package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-source-package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $Version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "name=XunQi-$Version-Windows-x64-source-BAT" >> $env:GITHUB_OUTPUT

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm lint && pnpm typecheck && pnpm test:run

      - name: Test Rust on Windows
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Build source and BAT ZIP
        shell: pwsh
        run: ./scripts/package-windows-source.ps1

      - name: Upload Windows source package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            release/${{ steps.package.outputs.name }}.zip
            release/${{ steps.package.outputs.name }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
