      <script>
        window.__timelines = window.__timelines || {};
        var demoTl = gsap.timeline({ paused: true });

        function revealScene(previousSelector, nextSelector, at, duration) {
          demoTl.to(previousSelector, {
            filter: "blur(12px)",
            scale: 1.025,
            opacity: 0,
            duration: duration,
            ease: "power2.inOut"
          }, at);
          demoTl.fromTo(nextSelector,
            { filter: "blur(12px)", scale: 0.985, opacity: 0 },
            { filter: "blur(0px)", scale: 1, opacity: 1, duration: duration, ease: "power2.inOut" },
            at + 0.08
          );
        }

        function animateScreenshot(sceneSelector, at, duration, direction) {
          demoTl.fromTo(sceneSelector + " .screen-frame img",
            { scale: 1.0, x: direction * -10, y: 0 },
            { scale: 1.032, x: direction * 14, y: -8, duration: duration, ease: "none" },
            at
          );
          demoTl.fromTo(sceneSelector + " .scene-caption",
            { y: 30, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
            at + 0.28
          );
          demoTl.fromTo(sceneSelector + " .scene-step",
            { x: 26, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.5, ease: "back.out(1.35)" },
            at + 0.48
          );
        }

        demoTl.fromTo(".brand-mark", { scale: 0.82, opacity: 0, rotation: -4 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.58, ease: "back.out(1.45)" }, 0);

        demoTl.fromTo(".brand-signature", { opacity: 0 }, { opacity: 1, duration: 0.32, ease: "power1.out" }, 0.7);

        animateScreenshot("#scene-article", 6.4, 4.0, 1);
        revealScene("#scene-article", "#scene-export-choice", 10.2, 0.38);
