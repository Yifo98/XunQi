[package]
name = "xunqi"
version = "0.5.0"
description = "Local-first WeChat link capture and export"
authors = ["XiaoFu"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xunqi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "=0.27.0"
ammonia = "=4.1.3"
base64 = "=0.22.1"
thiserror = "2.0.18"
url = "2.5.7"
libc = "0.2.186"
sha2 = "0.10.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSData"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSImage", "NSResponder", "NSRunningApplication", "NSWorkspace"] }

[target.'cfg(target_os = "windows")'.dependencies]
rcgen = "=0.14.5"
sha1 = "=0.10.6"
time = "=0.3.53"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinInet", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"
